name: Check OPL PS5 Games
on:
  schedule:
  - cron: '0 14 * * *' # Automatically runs once a day at 10:00 AM EST
  workflow_dispatch:      # Gives you a button to test it manually anytime

permissions:
  contents: write         # Allows the script to update seen_games.txt

jobs:
  check-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Scraper Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tracker Engine
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py

      - name: Commit and Save Seen Games List
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add seen_games.txt
          # Only commit and push if changes to the text file exist
          if ! git diff --cached --quiet; then
            git commit -m "Automated: Updated seen_games.txt registry"
            git push
          else
            echo "No change to tracking history file required."
          fi
